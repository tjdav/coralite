<template id="lists-window">
  <style>
    :host {
      display: block;
      padding: 1rem;
    }
    .list-container {
      height: 300px;
      overflow: auto;
      border: 1px solid #ccc;
    }
    .list-item {
      height: 50px;
      box-sizing: border-box;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
    }
  </style>

  <div class="list-container" ref="container"></div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client ({ refs, lists }) {
      const { createStore, bind } = lists

      const items = Array.from({ length: 1000 }, (_, i) => ({
        id: `item-${i}`,
        text: `Item #${i}`
      }))

      const store = createStore({ initial: items })

      const handle = bind({
        container: refs.container,
        store,
        key: (item) => item.id,
        create: (item) => {
          const div = document.createElement('div')
          div.className = 'list-item lists-row'
          div.textContent = item.text
          return div
        },
        virtual: 'window',
        size: 50,
        overscan: 3
      })

      return () => {
        handle.destroy()
      }
    }
  })
</script>
