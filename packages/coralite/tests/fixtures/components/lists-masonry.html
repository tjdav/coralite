<template id="lists-masonry">
  <style>
    :host {
      display: block;
      padding: 1rem;
    }
    .masonry-container {
      height: 400px;
      overflow: auto;
      border: 1px solid #ccc;
    }
    .masonry-item {
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      background: #fdfdfd;
    }
  </style>

  <div class="masonry-container" ref="container"></div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client ({ refs, lists }) {
      const { createStore, bind } = lists

      const items = Array.from({ length: 60 }, (_, i) => ({
        id: `m-item-${i}`,
        text: `Masonry #${i}`
      }))

      const store = createStore({ initial: items })

      const handle = bind({
        container: refs.container,
        store,
        key: (item) => item.id,
        create: (item) => {
          const div = document.createElement('div')
          div.className = 'masonry-item lists-row'
          div.textContent = item.text
          return div
        },
        layout: 'masonry',
        lanes: 3,
        gap: 12,
        virtual: 'window',
        size: 70
      })

      return () => {
        handle.destroy()
      }
    }
  })
</script>
