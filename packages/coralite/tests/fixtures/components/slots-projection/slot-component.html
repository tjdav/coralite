<template id="slot-component">
  <div data-testid="slot-container">
    <div data-testid="header-slot">
      <slot name="header">Default Header</slot>
    </div>
    <div data-testid="default-slot">
      <slot>Default Content</slot>
    </div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    slots: {
      header: (nodes) => {
        if (!nodes || nodes.length === 0) {
          return undefined
        }
        return nodes
      },
      default: (nodes) => {
        if (!nodes || nodes.length === 0) {
          return 'Fallback Content'
        }
        
        // Join all text content of nodes to check for 'Transform Me'
        const textContent = nodes.map(n => {
          if (n.type === 'text') {
            return n.data
          }

          if (n.children) {
            const childrenArr = Array.isArray(n.children) ? n.children : Array.from(n.children)

            return childrenArr.map(c => c.data || c.textContent || '').join('')
          }

          return ''
        }).join('').trim()
  
        if (textContent.includes('Transform Me')) {
          return 'Transformed: Transform Me'
        }
        return undefined
      }
    }
  })
</script>
