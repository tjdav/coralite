<template id="slot-test-container">
  <div class="test-container">
    <slot-popup>
      <input type="text" ref="searchBar" value="Init Search" data-testid="search-bar">
      <button ref="btnCancel" data-testid="cancel-button">Cancel</button>
    </slot-popup>
    <div data-testid="status-output">{{ clickStatus }}</div>
  </div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    server () {
      return {
        clickStatus: 'Idle'
      }
    },
    client ({ state, refs, signal }) {
      const searchBar = refs('searchBar')
      const btnCancel = refs('btnCancel')

      searchBar.addEventListener('input', (e) => {
        state.clickStatus = 'Searching: ' + e.target.value
      }, { signal })

      btnCancel.addEventListener('click', () => {
        state.clickStatus = 'Cancelled'
      }, { signal })
    }
  })
</script>
