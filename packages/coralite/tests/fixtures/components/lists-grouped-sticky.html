<template id="lists-grouped-sticky">
  <div ref="container" class="scroll-container"></div>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client ({ refs, signal, lists }) {
      const items = Array.from({ length: 40 }, (_, i) => ({
        id: String(i + 1),
        name: `Item ${i + 1}`,
        group: `Group ${Math.floor(i / 10) + 1}`
      }))

      const store = lists.createStore({
        key: (item) => item.id,
        initial: items
      })

      lists.bind({
        container: refs('container'),
        store,
        signal,
        key: (item) => item.id,
        virtual: 'window',
        size: 50,
        stickyGroups: true,
        groupBy: (item) => item.group,
        createHeader (groupKey) {
          const header = document.createElement('div')
          header.className = 'group-header'
          header.textContent = groupKey
          return header
        },
        create (item) {
          const div = document.createElement('div')
          div.className = 'item'
          div.textContent = item.name
          return div
        }
      })
    }
  })
</script>

<style>
  :host {
    display: block;
  }
  .scroll-container {
    height: 300px;
    overflow-y: auto;
    position: relative;
  }
</style>
