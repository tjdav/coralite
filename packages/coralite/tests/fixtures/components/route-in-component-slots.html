<template id="route-in-component-slots">
  <div class="slot-container">
    <slot></slot>
  </div>
</template>
<script type="module">
  import { defineComponent } from 'coralite'
  export default defineComponent({
    slots: {
      default (nodes, { route }) {
        return nodes.map(node => {
          if (node.attribs) {
            node.attribs['data-route'] = route.path
          }
          return node
        })
      }
    }
  })
</script>
