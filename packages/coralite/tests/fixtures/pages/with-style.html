<!DOCTYPE html>
<html>
<head>
  <script type="module">
    import { definePage } from 'coralite'

    export default definePage({
      server: () => ({ theme: 'dark' }),
      style: {
        '--page-theme': (state) => state.theme === 'dark' ? '#1a1a1a' : '#ffffff',
        '--page-accent': (state) => state.theme === 'dark' ? '#60a5fa' : '#2563eb'
      }
    })
  </script>
</head>
<body>
  <h1>Style Page</h1>
</body>
</html>
