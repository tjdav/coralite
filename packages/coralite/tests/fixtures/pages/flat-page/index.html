<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
</head>
<body data-count-label="{{ countLabel }}">
  <h1 data-testid="flat-title">{{ title }}</h1>
  <p data-testid="flat-summary">{{ summary }}</p>
  <button ref="increment" data-testid="flat-increment" type="button">{{ countLabel }}</button>
  <button ref="lang" data-testid="flat-lang" type="button">lang: {{ lang }}</button>
  <p data-testid="flat-client" hidden>client idle</p>
  <script type="module">
    export async function server () {
      return { title: 'Flat Page', count: 0, lang: 'en' }
    }

    export const getters = {
      summary: ({ state }) => `Summary: ${state.title}`,
      countLabel: ({ state }) => `count: ${state.count}`
    }

    export function client ({ state, refs, signal }) {
      const output = document.querySelector('[data-testid="flat-client"]')
      output.hidden = false
      output.textContent = 'client ready'

      refs('increment').addEventListener('click', () => {
        state.count += 1
        output.textContent = `client count: ${state.count}`
      }, { signal })

      refs('lang').addEventListener('click', () => {
        state.lang = state.lang === 'en' ? 'fr' : 'en'
      }, { signal })
    }
  </script>
</body>
</html>
