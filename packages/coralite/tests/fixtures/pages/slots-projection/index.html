<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slots Projection Test</title>
</head>
<body>
  <div id="fallback-test">
    <slot-component></slot-component>
  </div>
  
  <div id="transform-test">
    <slot-component>
      <div slot="default">Transform Me</div>
    </slot-component>
  </div>
  
  <div id="preserve-test">
    <slot-component>
      <button id="preserve-btn" onclick="this.textContent = 'Clicked'">Unchanged</button>
    </slot-component>
  </div>

  <div id="slot-nested-test">
    <slot-test-container></slot-test-container>
  </div>

  <div id="lost-reactivity-test">
    <lost-reactivity-parent></lost-reactivity-parent>
  </div>

  <div id="dynamic-reconciliation-test">
    <slot-component id="dynamic-slot-comp"></slot-component>
  </div>

  <div id="forwarded-slot-declarative-test">
    <fwd-user-card>
      <h2 slot="userHeader" class="fwd-title">Declarative Header Content</h2>
      <p class="fwd-body">Declarative Body Content</p>
    </fwd-user-card>
  </div>

  <div id="forwarded-slot-imperative-test"></div>
</body>
</html>
