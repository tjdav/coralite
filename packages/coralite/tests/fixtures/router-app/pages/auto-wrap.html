<!DOCTYPE html>
<html lang="en">
<head>
  <title>Auto Wrap Page</title>
</head>
<body>
  <nav>
    <a href="/" id="link-home">Home</a>
    <a href="/about" id="link-about">About</a>
  </nav>
  <h1 id="page-title">Auto Wrap Page</h1>
  <p id="auto-wrap-content">Rendered via automatic router outlet wrapper</p>
  <script type="module">
    import { definePage } from 'coralite'

    export default definePage({
      client ({ router }) {
        if (!router) {
          throw new Error('Router expected')
        }
      }
    })
  </script>
</body>
</html>
