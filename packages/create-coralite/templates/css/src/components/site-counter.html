<template id="coralite-counter">
  <button ref="count-button" type="button" class="btn">
    Count is {{ count }}
  </button>
</template>

<style>
  :host {
    display: inline-block;
  }

  .btn {
    background-color: var(--primary);
    color: var(--body-bg);
    border: none;
    border-radius: var(--border-radius);
    padding: var(--padding-y) var(--padding-x);
    font-family: var(--font-body);
    font-size: var(--spacer-base);
    cursor: pointer;
    box-shadow: var(--box-shadow);
    transition: background-color 0.2s ease-in-out;
  }

  .btn:hover {
    background-color: var(--code-colour);
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    // Declare and validate component input attributes
    attributes: {
      step: {
        type: Number,
        default: 1,
        validate: (val) => val > 0 || 'Step must be greater than 0'
      }
    },

    // Server-side initial state (executed during SSR/build and stripped from client bundle)
    server () {
      return {
        count: 0
      }
    },

    // Client-side interactive controller (executed in the browser upon hydration)
    async client ({ state, signal, refs, emit }) {
      // Dynamically import third-party modules ahead of time to avoid click latency
      const { default: confetti } = await import('https://esm.sh/canvas-confetti@latest')

      // Query element using its scoped ref attribute
      const button = refs('count-button')

      // Bind event listener with automatic signal cleanup on component unmount
      button.addEventListener('click', () => {
        // Direct reactive mutation triggers Coralite's O(1) microtask DOM updates
        state.count += state.step

        // Dispatch custom DOM event to parent listeners
        emit('count-change', { count: state.count })

        // Trigger confetti animation instantly
        confetti()
      }, { signal })
    }
  })
</script>
