<template id="coralite-footer">
  <footer class="text-center">
    Made with <a href="https://coralite.dev/" target="_blank">{{ name }}</a> © {{ year }}
  </footer>
</template>

<style>
  :host {
    display: block;
    margin-top: auto;
    padding: var(--padding-y) 0;
    text-align: center;
  }
</style>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    // Declare component attributes with automatic type coercion, defaults, and transformation
    attributes: {
      name: {
        type: String,
        // Synchronously transform and format attribute values before state application
        transform: (val) => (val ? val.trim().charAt(0).toUpperCase() + val.trim().slice(1) : 'Coralite')
      }
    },

    // Pure computed getters for derived or dynamic values
    getters: {
      year: () => new Date().getFullYear()
    }
  })
</script>
