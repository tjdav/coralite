name: Mirror to Codeberg

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: mirror-codeberg
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to Codeberg Mirror
        env:
          CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$CODEBERG_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ed25519 codeberg.org >> ~/.ssh/known_hosts

          git remote add codeberg git@codeberg.org:tjdavid/coralite.git

          # Mirror all branches and tags, pruning deleted references
          git push --prune --tags codeberg '+refs/heads/*:refs/heads/*'
