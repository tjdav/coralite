<template id="coralite-back-to-top">
  <a href="#" ref="backToTopBtn" class="back-to-top" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </a>
</template>

<script type="module">
  import { defineComponent } from 'coralite'

  export default defineComponent({
    client ({ refs, signal }) {
      const button = refs('backToTopBtn')

      // Throttle scroll handling to at most once per animation frame and make
      // the listener passive so it never blocks scrolling on the main thread.
      let ticking = false
      const onScroll = () => {
        if (ticking) {
          return
        }
        ticking = true
        requestAnimationFrame(() => {
          button.classList.toggle('visible', window.scrollY > 300)
          ticking = false
        })
      }

      window.addEventListener('scroll', onScroll, {
        passive: true,
        signal
      })

      button.addEventListener('click', (e) => {
        e.preventDefault()
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        })
      }, { signal })

      // Set the correct initial visibility (e.g. when a page loads mid-scroll).
      onScroll()
    }
  })
</script>
