<template id="site-mobile-nav">
  <button ref="toggleBtn" class="hamburger-btn" type="button" aria-label="Open menu">
    <ui-icon name="hamburger-menu" size="24"></ui-icon>
  </button>

  <div class="mobile-overlay {{ overlayClass }}" ref="overlay"></div>

  <div class="mobile-drawer {{ drawerClass }}">
    <div class="drawer-header">
      <span class="logo">Coralite</span>
      <button ref="closeBtn" class="close-btn" type="button" aria-label="Close menu">
        <ui-icon name="close" size="24"></ui-icon>
      </button>
    </div>
    
    <div class="drawer-content">
      <ui-nav-link href="/learn/">Learn</ui-nav-link>
      <ui-nav-link href="/docs/">Documentation</ui-nav-link>
      <ui-nav-link href="/docs/guide/">Guide</ui-nav-link>
      <ui-nav-link href="/docs/reference/">Reference</ui-nav-link>
      <ui-nav-link href="/reference/">Component API</ui-nav-link>
      <ui-nav-link href="/blog/">Blog</ui-nav-link>
      <ui-nav-link href="/changelog/">Changelog</ui-nav-link>
      <ui-nav-link href="/compare/">Compare</ui-nav-link>
      <ui-nav-link href="/why/">Why Coralite</ui-nav-link>
    </div>
  </div>
</template>

<script type="module">
  export const attributes = {
    open: { type: Boolean, default: false }
  }

  export const getters = {
    overlayClass: ({ state }) => (state.open ? 'is-open' : ''),
    drawerClass: ({ state }) => (state.open ? 'is-open' : '')
  }

  export function client ({ state, refs, signal }) {
    const toggleBtn = refs('toggleBtn')
    const closeBtn = refs('closeBtn')
    const overlay = refs('overlay')

    toggleBtn.addEventListener('click', () => {
      state.open = true
    }, { signal })

    closeBtn.addEventListener('click', () => {
      state.open = false
    }, { signal })

    overlay.addEventListener('click', () => {
      state.open = false
    }, { signal })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.open) {
        state.open = false
      }
    }, { signal })
  }
</script>
