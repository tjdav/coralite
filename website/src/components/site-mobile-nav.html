<template id="site-mobile-nav">
  <button ref="toggleBtn" class="hamburger-btn" type="button" aria-label="{{ toggleLabel }}" aria-expanded="{{ expanded }}" aria-controls="mobile-drawer">
    <ui-icon name="hamburger-menu" size="24"></ui-icon>
  </button>

  <div class="mobile-overlay {{ overlayClass }}" ref="overlay"></div>

  <div class="mobile-drawer {{ drawerClass }}" ref="drawer" id="mobile-drawer" role="dialog" aria-modal="true" aria-label="Menu" inert="{{ closed }}">
    <div class="drawer-header">
      <span class="logo">Coralite</span>
      <button ref="closeBtn" class="close-btn" type="button" aria-label="Close menu">
        <ui-icon name="close" size="24"></ui-icon>
      </button>
    </div>
    
    <div class="drawer-content">
      <ui-nav-link href="/learn/">Learn</ui-nav-link>
      <ui-nav-link href="/docs/">Documentation</ui-nav-link>
      <ui-nav-link href="/docs/guide/">Guide</ui-nav-link>
      <ui-nav-link href="/docs/reference/">Reference</ui-nav-link>
      <ui-nav-link href="/reference/">Component API</ui-nav-link>
      <ui-nav-link href="/blog/">Blog</ui-nav-link>
      <ui-nav-link href="/changelog/">Changelog</ui-nav-link>
      <ui-nav-link href="/compare/">Compare</ui-nav-link>
      <ui-nav-link href="/why/">Why Coralite</ui-nav-link>
    </div>
  </div>
</template>

<script type="module">
  export const attributes = {
    open: { type: Boolean, default: false }
  }

  export const getters = {
    overlayClass: ({ state }) => (state.open ? 'is-open' : ''),
    drawerClass: ({ state }) => (state.open ? 'is-open' : ''),
    expanded: ({ state }) => state.open,
    closed: ({ state }) => !state.open,
    toggleLabel: ({ state }) => (state.open ? 'Close menu' : 'Open menu')
  }

  export function client ({ state, refs, signal, observe }) {
    const toggleBtn = refs('toggleBtn')
    const closeBtn = refs('closeBtn')
    const overlay = refs('overlay')
    const drawer = refs('drawer')
    let lastFocused = null
    let background = []

    const setBackgroundInert = (on) => {
      if (on) {
        background = [document.querySelector('main'), document.querySelector('site-footer')].filter(Boolean)
      }
      for (const element of background) {
        if (on) {
          element.setAttribute('inert', '')
        } else {
          element.removeAttribute('inert')
        }
      }
      if (!on) {
        background = []
      }
    }

    observe('open', (open) => {
      if (open) {
        lastFocused = document.activeElement
        document.body.style.overflow = 'hidden'
        setBackgroundInert(true)
        requestAnimationFrame(() => closeBtn.focus())
      } else {
        document.body.style.overflow = ''
        setBackgroundInert(false)
        if (lastFocused instanceof HTMLElement) {
          lastFocused.focus()
        }
      }
    })

    drawer.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab' || !state.open) {
        return
      }
      const focusable = Array.from(drawer.querySelectorAll('a[href], button:not([disabled])'))
        .filter(element => element instanceof HTMLElement)
      if (!focusable.length) {
        return
      }
      const first = focusable[0]
      const last = focusable[focusable.length - 1]
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault()
        last.focus()
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault()
        first.focus()
      }
    }, { signal })

    toggleBtn.addEventListener('click', () => {
      state.open = true
    }, { signal })

    closeBtn.addEventListener('click', () => {
      state.open = false
    }, { signal })

    overlay.addEventListener('click', () => {
      state.open = false
    }, { signal })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.open) {
        state.open = false
      }
    }, { signal })
  }
</script>

  .hamburger-btn {

    border: none;

  @media (min-width: 1101px) {

  }

  .mobile-drawer.is-open {

  :host(#test-mobile-nav) .mobile-overlay,

</style>
