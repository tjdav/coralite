<template id="site-mobile-nav">
  <button ref="toggleBtn" class="hamburger-btn" type="button" aria-label="{{ toggleLabel }}" aria-expanded="{{ expanded }}" aria-controls="mobile-drawer">
    <ui-icon name="hamburger-menu" size="24"></ui-icon>
  </button>

  <div class="mobile-overlay {{ overlayClass }}" ref="overlay"></div>

  <div class="mobile-drawer {{ drawerClass }}" ref="drawer" id="mobile-drawer" role="dialog" aria-modal="true" aria-label="Site menu" inert="{{ closed }}">
    <div class="drawer-header">
      <a href="/" class="drawer-logo" aria-label="Coralite home">Coralite</a>
      <button ref="closeBtn" class="close-btn" type="button" aria-label="Close menu">
        <ui-icon name="close" size="24"></ui-icon>
      </button>
    </div>

    <div class="drawer-content">
      <button ref="searchBtn" class="drawer-search" type="button" aria-keyshortcuts="Control+K">
        <ui-icon name="search" size="16"></ui-icon>
        <span>Search</span>
        <kbd>Ctrl K</kbd>
      </button>

      <nav class="drawer-nav" aria-label="Primary">
        <p class="drawer-label">Explore</p>
        <ui-nav-link href="/learn/" active="{{ learnActive }}">Learn</ui-nav-link>
        <ui-nav-link href="/docs/" active="{{ docsActive }}">Docs</ui-nav-link>
        <ui-nav-link href="/reference/" active="{{ referenceActive }}">Reference</ui-nav-link>

        <p class="drawer-label drawer-label--spaced">Project</p>
        <ui-nav-link href="/why/">Why Coralite</ui-nav-link>
        <ui-nav-link href="/compare/">Compare</ui-nav-link>
        <ui-nav-link href="/blog/">Blog</ui-nav-link>
        <ui-nav-link href="/changelog/">Changelog</ui-nav-link>
      </nav>

      <div class="drawer-footer">
        <a href="https://github.com/tjdav/coralite" class="drawer-github">
          <ui-icon name="github" size="16"></ui-icon>
          <span>GitHub</span>
        </a>
        <ui-badge variant="violet">v{{ version }}</ui-badge>
      </div>
    </div>
  </div>
</template>

<script type="module">
  export const attributes = {
    open: { type: Boolean, default: false }
  }

  export const getters = {
    overlayClass: ({ state }) => (state.open ? 'is-open' : ''),
    drawerClass: ({ state }) => (state.open ? 'is-open' : ''),
    expanded: ({ state }) => state.open,
    closed: ({ state }) => !state.open,
    toggleLabel: ({ state }) => (state.open ? 'Close menu' : 'Open menu'),
    learnActive: ({ route }) => route.path.startsWith('/learn'),
    docsActive: ({ route }) => route.path.startsWith('/docs'),
    referenceActive: ({ route }) => route.path.startsWith('/reference')
  }

  export function server ({ $version }) {
    return { version: $version }
  }

  export function client ({ state, refs, signal, observe }) {
    const toggleBtn = refs('toggleBtn')
    const closeBtn = refs('closeBtn')
    const searchBtn = refs('searchBtn')
    const overlay = refs('overlay')
    const drawer = refs('drawer')
    let lastFocused = null
    let background = []
    let previousOverflow = ''
    let resizeQuery = null

    const setBackgroundInert = (on) => {
      if (on) {
        background = [...document.querySelectorAll('main, site-footer, .skip-link, .logo-link, .desktop-nav, .desktop-actions')]
      }
      for (const element of background) {
        if (on) {
          element.setAttribute('inert', '')
        } else {
          element.removeAttribute('inert')
        }
      }
      if (!on) {
        background = []
      }
    }

    const close = () => {
      if (state.open) {
        state.open = false
      }
    }

    observe('open', (open) => {
      if (open) {
        lastFocused = document.activeElement
        previousOverflow = document.body.style.overflow
        document.body.style.overflow = 'hidden'
        setBackgroundInert(true)
        requestAnimationFrame(() => closeBtn.focus())
      } else {
        document.body.style.overflow = previousOverflow
        setBackgroundInert(false)
        if (lastFocused instanceof HTMLElement) {
          lastFocused.focus()
        }
      }
    })

    drawer.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab' || !state.open) {
        return
      }
      const focusable = Array.from(drawer.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])'))
        .filter(element => element instanceof HTMLElement)
      if (!focusable.length) {
        return
      }
      const first = focusable[0]
      const last = focusable[focusable.length - 1]
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault()
        last.focus()
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault()
        first.focus()
      }
    }, { signal })

    drawer.addEventListener('click', (event) => {
      const link = event.target.closest('a[href]')
      if (link) {
        close()
      }
    }, { signal })

    toggleBtn.addEventListener('click', () => {
      state.open = true
    }, { signal })

    closeBtn.addEventListener('click', close, { signal })
    overlay.addEventListener('click', close, { signal })

    searchBtn.addEventListener('click', () => {
      close()
      document.dispatchEvent(new CustomEvent('coralite:open-command-palette'))
    }, { signal })

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.open) {
        close()
      }
    }, { signal })

    window.addEventListener('coralite:navigated', close, { signal })

    resizeQuery = window.matchMedia('(min-width: 1101px)')
    resizeQuery.addEventListener('change', (event) => {
      if (event.matches) {
        close()
      }
    }, { signal })
  }
</script>
