<template id="ui-nav-link">
  <a href="{{ href }}" class="c-nav-link {{ activeClass }}" aria-current="{{ current }}">
    <slot></slot>
  </a>
</template>

<script type="module">
  export const attributes = {
    href: { type: String, required: true },
    active: { type: Boolean, default: false }
  }

  export const getters = {
    activeClass: ({ state, route }) => (state.active || isCurrentPath(route, state.href) ? 'c-nav-link--active' : ''),
    current: ({ state, route }) => (state.active || isCurrentPath(route, state.href) ? 'page' : null)
  }

  function isCurrentPath (route, href) {
    if (!route || !route.path) {
      return false
    }
    return route.path.replace(/\/+$/, '') === href.replace(/\/+$/, '')
  }
</script>

<style>
  :host {
    display: block;
    width: 100%;
  }

  .c-nav-link {
    display: flex;
    align-items: center;

    font-size: 14px;
    font-weight: 500;
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
    transition: all 0.2s ease;
  }

  .c-nav-link:hover {
    color: var(--text-primary);
    background-color: var(--bg-card);
  }

  .c-nav-link--active {
    background-color: rgba(139, 92, 246, 0.1);

  }
</style>
