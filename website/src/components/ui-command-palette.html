<template id="ui-command-palette">
  <div class="cp-overlay {{ openClass }}" ref="overlay">
    <div class="cp-modal" role="dialog" aria-modal="true" aria-label="Search">
      <div class="cp-header">
        <ui-icon name="search" size="20" class="cp-icon"></ui-icon>
        <input
          ref="searchInput"
          class="cp-input"
          type="text"
          role="combobox"
          aria-label="Search the site"
          aria-autocomplete="list"
          aria-expanded="true"
          aria-controls="cp-results"
          placeholder="Search docs, reference, lessons, and posts..."
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="cp-esc">esc</kbd>
      </div>

      <div class="cp-results" ref="resultsContainer" id="cp-results" role="listbox" aria-label="Search results"></div>

      <p class="cp-status" ref="status" aria-live="polite"></p>

      <div class="cp-footer">
        <div class="cp-hints">
          <span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>
          <span><kbd>↵</kbd> to open</span>
        </div>
        <span class="cp-brand">Search by Coralite</span>
      </div>
    </div>
  </div>
</template>

<script type="module">
  export const attributes = {
    open: { type: Boolean, default: false }
  }

  export const getters = {
    openClass: ({ state }) => (state.open ? 'is-open' : '')
  }

  export function client ({ state, refs, signal, observe }) {
    const overlay = refs('overlay')
    const searchInput = refs('searchInput')
    const resultsContainer = refs('resultsContainer')
    const status = refs('status')

    const fallback = [
      { title: 'Documentation', url: '/docs/', kind: 'docs', description: 'Guides, concepts, and the full reference' },
      { title: 'Getting Started', url: '/docs/guide/getting-started/', kind: 'docs', description: 'Install Coralite and build your first page' },
      { title: 'Component API', url: '/reference/', kind: 'docs', description: 'Every component export' },
      { title: 'Learn', url: '/learn/', kind: 'learn', description: 'The zero-syntax curriculum' },
      { title: 'Blog', url: '/blog/', kind: 'blog', description: 'Articles and release notes' },
      { title: 'Changelog', url: '/changelog/', kind: 'docs', description: 'Every release' }
    ]

    let fuse = null
    let items = []
    let activeIndex = 0
    let loading = null

    const ensureIndex = () => {
      if (loading) {
        return loading
      }
      loading = (async () => {
        try {
          const [{ default: Fuse }, response] = await Promise.all([
            import('fuse.js'),
            fetch('/search-index.json')
          ])
          if (!response.ok) {
            return
          }
          const entries = await response.json()
          if (Array.isArray(entries) && entries.length) {
            fuse = new Fuse(entries, {
              keys: [
                { name: 'title', weight: 0.6 },
                { name: 'description', weight: 0.25 },
                { name: 'content', weight: 0.15 }
              ],
              threshold: 0.35,
              ignoreLocation: true,
              minMatchCharLength: 2
            })
          }
        } catch {
          // Offline or dev without an index: keep the curated fallback list.
        }
      })()
      return loading
    }

    const updateActiveDescendant = () => {
      const active = items[activeIndex]
      if (active) {
        searchInput.setAttribute('aria-activedescendant', active.id)
      } else {
        searchInput.removeAttribute('aria-activedescendant')
      }
    }

    const render = (results) => {
      resultsContainer.replaceChildren()
      items = []
      status.textContent = results.length === 1 ? '1 result' : `${results.length} results`

      if (!results.length) {
        const empty = document.createElement('p')
        empty.className = 'cp-empty'
        empty.textContent = 'No results.'
        resultsContainer.appendChild(empty)
        updateActiveDescendant()
        return
      }

      for (const result of results) {
        const link = document.createElement('a')
        link.className = 'cp-item' + (items.length === activeIndex ? ' active' : '')
        link.href = result.url
        link.id = `cp-option-${items.length}`
        link.setAttribute('role', 'option')
        link.setAttribute('aria-selected', String(items.length === activeIndex))
        link.tabIndex = -1

        const kind = document.createElement('span')
        kind.className = 'cp-kind'
        kind.textContent = result.kind || 'docs'

        const text = document.createElement('span')
        text.className = 'cp-item-text'

        const title = document.createElement('span')
        title.className = 'cp-title'
        title.textContent = result.title || result.url

        const description = document.createElement('span')
        description.className = 'cp-desc'
        description.textContent = result.description || ''

        text.append(title, description)
        link.append(kind, text)
        resultsContainer.appendChild(link)
        items.push(link)
      }

      updateActiveDescendant()
    }

    const search = () => {
      const query = searchInput.value.trim()
      if (!query) {
        render(fallback)
        activeIndex = 0
        return
      }
      const results = fuse
        ? fuse.search(query, { limit: 8 }).map(match => match.item)
        : fallback.filter(item => item.title.toLowerCase().includes(query.toLowerCase()))
      activeIndex = 0
      render(results)
    }

    const setActive = (nextIndex) => {
      if (!items.length) {
        return
      }
      items[activeIndex]?.classList.remove('active')
      items[activeIndex]?.setAttribute('aria-selected', 'false')
      activeIndex = (nextIndex + items.length) % items.length
      items[activeIndex].classList.add('active')
      items[activeIndex].setAttribute('aria-selected', 'true')
      items[activeIndex].scrollIntoView({ block: 'nearest' })
      searchInput.setAttribute('aria-activedescendant', items[activeIndex].id)
    }

    let lastFocused = null
    let background = []

    const setBackgroundInert = (on) => {
      if (on) {
        background = [document.querySelector('main'), document.querySelector('site-footer')].filter(Boolean)
      }
      for (const element of background) {
        if (on) {
          element.setAttribute('inert', '')
        } else {
          element.removeAttribute('inert')
        }
      }
      if (!on) {
        background = []
      }
    }

    const closePalette = () => {
      state.open = false
    }

    const openPalette = () => {
      const trigger = document.querySelector('.search-btn')
      const focused = document.activeElement
      lastFocused = focused instanceof HTMLElement && focused !== document.body
        ? focused
        : trigger

      state.open = true
      ensureIndex().then(search)
    }

    observe('open', (open) => {
      if (open) {
        document.body.style.overflow = 'hidden'
        setBackgroundInert(true)
        requestAnimationFrame(() => searchInput.focus())
      } else {
        document.body.style.overflow = ''
        setBackgroundInert(false)
        if (lastFocused instanceof HTMLElement) {
          lastFocused.focus()
        }
      }
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault()
        openPalette()
      }
      if (e.key === 'Escape' && state.open) {
        e.preventDefault()
        closePalette()
      }
    }, { signal })

    document.addEventListener('coralite:open-command-palette', openPalette, { signal })

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        closePalette()
      }
    }, { signal })

    overlay.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault()
        searchInput.focus()
      }
    }, { signal })

    searchInput.addEventListener('input', search, { signal })

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault()
        setActive(activeIndex + 1)
      } else if (e.key === 'ArrowUp') {
        e.preventDefault()
        setActive(activeIndex - 1)
      } else if (e.key === 'Enter') {
        e.preventDefault()
        const active = items[activeIndex]
        if (active) {
          closePalette()
          active.click()
        }
      }
    }, { signal })

    render(fallback)
  }
</script>
