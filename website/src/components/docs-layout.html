<template id="docs-layout">
  <div class="layout-grid">
    <aside class="sidebar-wrapper">
      <button class="mobile-disclosure-toggle" type="button" ref="sidebarToggle" aria-expanded="false" aria-controls="docs-nav-panel">
        <span>Documentation menu</span>
        <ui-icon name="chevron-down" size="16"></ui-icon>
      </button>
      <div class="mobile-disclosure-panel" id="docs-nav-panel" ref="sidebarPanel">
        <slot name="sidebar"></slot>
      </div>
    </aside>
    <main class="content-wrapper" id="main-content" tabindex="-1">
      <slot name="content"></slot>
    </main>
    <aside class="toc-wrapper">
      <button class="mobile-disclosure-toggle" type="button" ref="tocToggle" aria-expanded="false" aria-controls="docs-toc-panel">
        <span>On this page</span>
        <ui-icon name="chevron-down" size="16"></ui-icon>
      </button>
      <div class="mobile-disclosure-panel" id="docs-toc-panel" ref="tocPanel">
        <slot name="toc"></slot>
      </div>
    </aside>
  </div>
</template>

<script type="module">
  export const attributes = {}

  export function client ({ root, refs, signal }) {
    const mobileQuery = window.matchMedia('(max-width: 1100px)')

    const bindDisclosure = (toggle, panel) => {
      const setCollapsed = (collapsed) => {
        panel.dataset.collapsed = String(collapsed)
        toggle.setAttribute('aria-expanded', String(!collapsed))
      }

      setCollapsed(mobileQuery.matches)
      toggle.addEventListener('click', () => {
        setCollapsed(panel.dataset.collapsed !== 'true')
      }, { signal })
      mobileQuery.addEventListener('change', (event) => {
        setCollapsed(event.matches)
      }, { signal })
    }

    bindDisclosure(refs('sidebarToggle'), refs('sidebarPanel'))
    bindDisclosure(refs('tocToggle'), refs('tocPanel'))

    const links = [...root.querySelectorAll('.docs-toc a[href^="#"]')]
    if (!links.length) return

    const entries = links
      .map(link => {
        const id = decodeURIComponent(link.getAttribute('href').slice(1))
        const heading = document.getElementById(id)
        return heading ? { link, heading } : null
      })
      .filter(Boolean)
      .sort((a, b) => a.heading.getBoundingClientRect().top - b.heading.getBoundingClientRect().top)

    if (!entries.length) return

    let frame = 0

    const update = () => {
      frame = 0
      if (signal.aborted) return

      const offset = 120
      const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2
      let current = entries[0]

      if (atBottom) {
        current = entries[entries.length - 1]
      } else {
        for (const entry of entries) {
          if (entry.heading.getBoundingClientRect().top <= offset) current = entry
          else break
        }
      }

      for (const entry of entries) {
        const active = entry === current
        entry.link.classList.toggle('active', active)
        if (active) {
          entry.link.setAttribute('aria-current', 'location')
        } else {
          entry.link.removeAttribute('aria-current')
        }
      }
    }

    const schedule = () => {
      if (frame || signal.aborted) return
      frame = requestAnimationFrame(update)
    }

    // The client runtime intercepts internal link clicks, including same-page
    // hash links, so anchor clicks do not scroll by default. Handle TOC and
    // in-page anchors ourselves.
    root.addEventListener('click', (event) => {
      const anchor = event.target.closest('a[href^="#"]')
      if (!anchor || !root.contains(anchor)) return

      const id = decodeURIComponent(anchor.getAttribute('href').slice(1))
      const target = document.getElementById(id)
      if (!target) return

      event.preventDefault()
      event.stopPropagation()

      if (window.location.hash !== `#${id}`) {
        history.pushState(null, '', `#${id}`)
      }

      target.scrollIntoView({ block: 'start' })
      update()
    }, { signal })

    document.addEventListener('scroll', schedule, { passive: true, signal })
    window.addEventListener('resize', schedule, { signal })
    update()
  }
</script>

<style>
  :host {
    display: block;
  }

  .layout-grid {
    display: grid;
    grid-template-columns: 280px 1fr 240px;
    gap: 48px;
    max-width: 1440px;
    margin: 0 auto;
    padding: 48px 24px;
    align-items: start;
  }

  .sidebar-wrapper, .toc-wrapper {
    position: sticky;
    top: 88px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }

  .layout-grid > * {
    min-width: 0;
  }

  .content-wrapper {
    max-width: 800px;
  }

  .mobile-disclosure-toggle {
    display: none;
  }

  @media (max-width: 1100px) {
    .layout-grid {
      grid-template-columns: 1fr;
      padding: 24px;
    }

    .sidebar-wrapper,
    .toc-wrapper {
      position: static;
      display: block;
      max-height: none;
      margin-bottom: 8px;
      overflow: visible;
    }

    .sidebar-wrapper {
      order: 1;
    }

    .toc-wrapper {
      order: 2;
    }

    .content-wrapper {
      order: 3;
    }

    .mobile-disclosure-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      cursor: pointer;
    }

    .mobile-disclosure-toggle[aria-expanded="true"] ui-icon {
      transform: rotate(180deg);
    }

    .mobile-disclosure-panel {
      padding-top: 12px;
    }

    .mobile-disclosure-panel[data-collapsed="true"] {
      display: none;
    }
  }
</style>
