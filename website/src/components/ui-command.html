<template id="ui-command">
  <div class="command">
    <span class="prompt" aria-hidden="true">{{ prompt }}</span>
    <code class="text">{{ command }}</code>
    <button ref="copy" type="button" class="copy" aria-label="Copy command">
      <svg class="icon icon-copy" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15V6a2 2 0 0 1 2-2h9"></path>
      </svg>
      <svg class="icon icon-check" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="m5 13 4 4L19 7"></path>
      </svg>
    </button>
    <span ref="status" class="status" role="status" aria-live="polite"></span>
  </div>
</template>

<script type="module">
  export const attributes = {
    command: { type: String, required: true },
    prompt: { type: String, default: '$' }
  }

  export async function client ({ state, refs, signal }) {
    const button = refs('copy')
    const status = refs('status')
    let reset

    button.addEventListener('click', async () => {
      await navigator.clipboard.writeText(state.command)
      button.setAttribute('data-copied', '')
      status.textContent = 'Copied to clipboard'
      clearTimeout(reset)
      reset = setTimeout(() => {
        button.removeAttribute('data-copied')
        status.textContent = ''
      }, 2000)
    }, { signal })

    signal.addEventListener('abort', () => clearTimeout(reset))
  }
</script>
