<script type="module">
  export const attributes = {
    active: { type: String, default: '' }
  }

  export function client ({ root, state }) {
    if (!state.active) {
      return
    }

    const current = root.querySelector(`[data-page="${state.active}"]`)
    if (current) {
      current.setAttribute('aria-current', 'page')
    }
  }
</script>
