<template id="page-meta">
  <title>{{ fullTitle }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonicalUrl }}">
  <meta name="robots" content="{{ robots }}">

  <meta property="og:type" content="{{ type }}">
  <meta property="og:site_name" content="Coralite">
  <meta property="og:title" content="{{ fullTitle }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonicalUrl }}">
  <meta property="og:image" content="{{ imageUrl }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ fullTitle }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ fullTitle }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ imageUrl }}">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#0B0F19">

  <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "WebSite", "name": "Coralite", "url": "https://coralite.dev/" }
  </script>
  <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "Organization", "name": "Coralite", "url": "https://coralite.dev/", "logo": "https://coralite.dev/images/social.png" }
  </script>
</template>

<script type="module">
  export const attributes = {
    title: { type: String, required: true },
    description: { type: String, required: true },
    section: { type: String, default: '' },
    type: { type: String, default: 'website' },
    image: { type: String, default: '/images/social.png' },
    noindex: { type: Boolean, default: false }
  }

  export const getters = {
    fullTitle: ({ state }) => state.section
      ? `${state.title} — Coralite ${state.section}`
      : state.title,
    canonicalUrl: ({ state }) => `https://coralite.dev${state.routePath}`,
    imageUrl: ({ state }) => state.image.startsWith('http')
      ? state.image
      : `https://coralite.dev${state.image}`,
    robots: ({ state }) => state.noindex
      ? 'noindex, follow'
      : 'index, follow, max-image-preview:large'
  }

  export function server ({ page }) {
    const pathname = page.url.pathname
    const filePath = page.file?.pathname || ''
    const isIndexPage = /(^|\/)index\.html$/.test(filePath)

    if (pathname === '/' || pathname === '/index.html') {
      return { routePath: '/' }
    }

    if (isIndexPage) {
      return { routePath: `${pathname.replace(/\/+$/, '')}/` }
    }

    return { routePath: pathname.replace(/\.html$/, '') }
  }
</script>
